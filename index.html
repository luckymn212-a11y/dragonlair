<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonLair</title>
    <style>
        /* Styling dasar aplikasi */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .btn {
            background-color: #f59e0b;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Contoh Layar Social -->
    <div id="screen-social">
        <h2>SOCIAL & INVITE</h2>
        <p>Grow your community and earn passive rewards.</p>
        <button class="btn" onclick="copyReferralLink()">Copy Invite Link</button>
    </div>

    <script>
        // Simulasi data player
        let player = {
            zentic: 0,
            nest: []
        };

        // Fungsi Salin Link Referral
        function copyReferralLink() {
            let userId = "123456789"; 
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                userId = window.Telegram.WebApp.initDataUnsafe.user.id;
            }

            let botUsername = "DragonzenticBot"; 
            let referralLink = `https://t.me/${botUsername}?start=ref_${userId}`;

            navigator.clipboard.writeText(referralLink).then(() => {
                alert("Referral link copied to clipboard!\n\n" + referrallink);
            }).catch(err => {
                prompt("Copy your referral link below:", referralLink);
            });
        }

        // Fungsi Pembelian Telur dengan Validasi Saldo ZNT
        function buyEgg(eggType, customPrice) {
            let price = customPrice || 50000;
            let rarity = "Common";
            let lifespanDays = 30;
            let yieldVal = 500;

            if (typeof player.zentic === 'undefined') {
                player.zentic = 0;
            }

            // Pengecekan saldo ZNT
            if (player.zentic < price) {
                alert(`ZNT kamu tidak cukup! Kamu butuh ${price.toLocaleString()} ZNT, tapi saldo kamu hanya ${player.zentic.toLocaleString()} ZNT.`);
                return; 
            }

            // Kurangi saldo ZNT
            player.zentic -= price;

            // Masukkan naga baru ke Nest
            player.nest.push({
                id: `dragon_${Date.now()}`,
                rarity: rarity,
                yieldPerHour: yieldVal,
                createdAt: Date.now(),
                expiresAt: Date.now() + (lifespanDays * 24 * 60 * 60 * 1000),
                status: "ACTIVE"
            });

            alert(`Successfully purchased ${eggType}!`);
            updateUI();
        }

        function updateUI() {
            // Fungsi pembaruan tampilan layar (UI)
            console.log("UI Updated. Current ZNT:", player.zentic);
        }
    </script>
</body>
</html>
