<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragonlair - Mini App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 85%;
            max-width: 360px;
        }
        h1 {
            color: #f59e0b;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .balance-card {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #f59e0b;
        }
        .balance-title {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
        }
        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #f59e0b;
        }
        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐉 DRAGONLAIR</h1>
        <p>Telegram Mini App MVP</p>
        
        <div class="balance-card">
            <div class="balance-title">Zentic Balance</div>
            <div class="balance-amount" id="score">1,000 ZNT</div>
        </div>

        <button class="btn" onclick="collectReward()">Klaim Harian (+100)</button>
    </div>

    <script>
        let zentic = 1000;
        function collectReward() {
            zentic += 100;
            document.getElementById('score').innerText = zentic.toLocaleString() + ' ZNT';
        }
    </script>
</body>
</html>
